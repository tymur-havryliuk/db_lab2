# Інфраструктура лаби 2. Облікові дані беруться з .env.
# postgres і mongo мають однакові ліміти ресурсів, neo4j у profile `graph`, щоб не працював під час бенчмарку.
services:
  postgres:
    image: postgres:16
    container_name: lab2-postgres
    # /dev/shm за замовчуванням 64 MB, цього мало для VACUUM і паралельних запитів
    shm_size: 512m
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - lab2_pgdata:/var/lib/postgresql/data
    cpus: "2"
    mem_limit: 2g
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c synchronous_commit=on
      -c fsync=on
      -c max_wal_size=4GB
      -c track_io_timing=on
      -c jit=off
      -c random_page_cost=1.1
      -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:8.2  # mongo:8/8.0 не стартують на ядрі Linux >=6.19 (SERVER-121912)
    container_name: lab2-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      # В образі glibc.pthread.rseq=0, через це TCMalloc використовує per-CPU кеші.
      # На ядрі 7.0 у Docker VM це дає segfault при одночасних записах.
      # З rseq=1 TCMalloc переходить на per-thread кеші.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - lab2_mongodata:/data/db
    cpus: "2"
    mem_limit: 2g
    # як shared_buffers=512MB у PostgreSQL
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: lab2-neo4j
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - lab2_neo4jdata:/data
    cpus: "2"
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  lab2_pgdata:
  lab2_mongodata:
  lab2_neo4jdata:
