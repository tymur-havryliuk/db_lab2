[project]
name = "lab2"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pymongo>=4.10",
    "neo4j>=5.26",
    "Faker",
    "pandas",
    "matplotlib",
    "python-dotenv",
    "numpy",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
